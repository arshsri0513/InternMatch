<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - InternMatch</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .auth-container {
      max-width: 400px;
      margin: 80px auto;
      background: #fff;
      padding: 40px;
      border-radius: 18px;
      box-shadow: 0 8px 28px rgba(20,32,51,.05);
      border: 1px solid #e3e8ef;
    }
    .auth-container h1 {
      margin-top: 0;
      font-size: 28px;
      margin-bottom: 24px;
      letter-spacing: -0.02em;
    }
    .auth-container .form-group {
      margin-bottom: 16px;
    }
    .auth-container button {
      width: 100%;
      margin-top: 10px;
    }
    .back-link {
      display: block;
      margin-top: 20px;
      text-align: center;
      color: #667085;
      text-decoration: none;
      font-size: 14px;
    }
    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">IM</span><span>InternMatch</span></div>
  </header>

  <div class="auth-container">
    <h1>Welcome back</h1>
    <div class="form-group">
      <label for="email">Email address</label>
      <input type="email" id="email" placeholder="you@example.com">
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="••••••••">
    </div>
    <button class="primary" onclick="window.location.href='index.html'">Log in</button>
    <a href="index.html" class="back-link">Return to Prototype</a>
  </div>
</body>
</html>
